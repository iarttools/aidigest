<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The same reduction has more impact on more expensive models</title>
  <desc id="desc">Illustrative comparison of 51 percent fewer input tokens. Fast, balanced, and premium models save 51, 153, and 510 normalized cost units.</desc>
  <rect width="1200" height="560" rx="18" fill="#0b0b0a"/>
  <text x="54" y="56" fill="#f27a4b" font-family="Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">THE TOKEN MULTIPLIER</text>
  <text x="54" y="104" fill="#f4f0e9" font-family="Arial,sans-serif" font-size="31" font-weight="700">The same reduction matters more when the model costs more.</text>
  <text x="54" y="137" fill="#a69c92" font-family="Arial,sans-serif" font-size="16">Illustrative example: 100k input tokens → 49k. This is not a price list.</text>
  <g font-family="Consolas,monospace" font-size="13"><text x="54" y="202" fill="#8d8379">MODEL TYPE</text><text x="330" y="202" fill="#8d8379">ORIGINAL COST</text><text x="580" y="202" fill="#8d8379">COST AFTER AIDIGEST</text><text x="950" y="202" fill="#8d8379">UNITS SAVED</text><line x1="54" y1="220" x2="1146" y2="220" stroke="#2c2925"/></g>
  <g font-family="Arial,sans-serif" font-size="16">
    <text x="54" y="270" fill="#f4f0e9">Fast / mini / flash</text><text x="330" y="270" fill="#91c7ff" font-family="Consolas,monospace">100</text><rect x="580" y="252" width="196" height="26" rx="4" fill="#26323e"/><rect x="580" y="252" width="96" height="26" rx="4" fill="#91c7ff"/><text x="802" y="271" fill="#a69c92" font-family="Consolas,monospace">49</text><text x="950" y="270" fill="#91c7ff" font-family="Consolas,monospace" font-weight="700">51</text>
    <text x="54" y="350" fill="#f4f0e9">Balanced / standard / sonnet</text><text x="330" y="350" fill="#c19cff" font-family="Consolas,monospace">300</text><rect x="580" y="332" width="196" height="26" rx="4" fill="#30283d"/><rect x="580" y="332" width="96" height="26" rx="4" fill="#c19cff"/><text x="802" y="351" fill="#a69c92" font-family="Consolas,monospace">147</text><text x="950" y="350" fill="#c19cff" font-family="Consolas,monospace" font-weight="700">153</text>
    <text x="54" y="430" fill="#f4f0e9">Premium / frontier / opus</text><text x="330" y="430" fill="#f27a4b" font-family="Consolas,monospace">1000</text><rect x="580" y="412" width="196" height="26" rx="4" fill="#3b241b"/><rect x="580" y="412" width="96" height="26" rx="4" fill="#f27a4b"/><text x="802" y="431" fill="#a69c92" font-family="Consolas,monospace">490</text><text x="950" y="430" fill="#f27a4b" font-family="Consolas,monospace" font-weight="700">510</text>
  </g>
  <text x="54" y="510" fill="#756d65" font-family="Arial,sans-serif" font-size="13">The token reduction is the same; the financial impact depends on each provider's input price.</text>
</svg>

