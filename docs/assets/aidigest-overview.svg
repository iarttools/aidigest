<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">aidigest elimina ruido antes de que llegue a tu IA</title>
  <desc id="desc">Una página ruidosa entra en aidigest y sale como contexto limpio, seguro y medible. La demostración local reduce 259 tokens a 126.</desc>
  <rect width="1200" height="440" rx="18" fill="#0b0b0a"/>
  <path d="M40 78h1120M40 372h1120" stroke="#2c2925"/>
  <text x="54" y="48" fill="#f27a4b" font-family="Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">AIDIGEST / CONTEXT RUNTIME</text>
  <text x="54" y="135" fill="#f4f0e9" font-family="Arial,sans-serif" font-size="38" font-weight="700">Tu IA no necesita leerlo todo.</text>
  <text x="54" y="174" fill="#a69c92" font-family="Arial,sans-serif" font-size="19">Menos ruido. Más respuestas útiles. Menos tokens.</text>
  <g transform="translate(54 225)">
    <rect width="230" height="105" rx="8" fill="#151412" stroke="#3a342e"/>
    <text x="18" y="27" fill="#8d8379" font-family="Consolas,monospace" font-size="11">PÁGINA WEB</text>
    <text x="18" y="58" fill="#f4f0e9" font-family="Arial,sans-serif" font-size="17">HTML + anuncios</text>
    <text x="18" y="84" fill="#8d8379" font-family="Arial,sans-serif" font-size="13">menús · scripts · ruido</text>
  </g>
  <path d="M302 277h82" stroke="#f27a4b" stroke-width="2"/><path d="m370 267 14 10-14 10" fill="none" stroke="#f27a4b" stroke-width="2"/>
  <g transform="translate(404 225)">
    <rect width="330" height="105" rx="8" fill="#1c120e" stroke="#f27a4b"/>
    <text x="18" y="27" fill="#f27a4b" font-family="Consolas,monospace" font-size="11">AIDIGEST</text>
    <text x="18" y="58" fill="#f4f0e9" font-family="Arial,sans-serif" font-size="17">extrae · protege · comprime</text>
    <text x="18" y="84" fill="#c9a898" font-family="Arial,sans-serif" font-size="13">y deja un recibo verificable</text>
  </g>
  <path d="M752 277h82" stroke="#f27a4b" stroke-width="2"/><path d="m820 267 14 10-14 10" fill="none" stroke="#f27a4b" stroke-width="2"/>
  <g transform="translate(854 225)">
    <rect width="292" height="105" rx="8" fill="#111815" stroke="#79c78a"/>
    <text x="18" y="27" fill="#79c78a" font-family="Consolas,monospace" font-size="11">CONTEXTO ÚTIL</text>
    <text x="18" y="65" fill="#f4f0e9" font-family="Consolas,monospace" font-size="30" font-weight="700">259 → 126</text>
    <text x="18" y="88" fill="#a9c9af" font-family="Arial,sans-serif" font-size="13">51% menos tokens en la demo local</text>
  </g>
  <text x="54" y="407" fill="#756d65" font-family="Consolas,monospace" font-size="11">OPEN SOURCE · GRATIS · LOCAL POR DEFECTO · SIN API KEY</text>
  <text x="1146" y="407" fill="#f27a4b" font-family="Consolas,monospace" font-size="11" text-anchor="end">github.com/aidigest</text>
</svg>

