name: release

on:
  release:
    types: [created]

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:electron
      - uses: softprops/action-gh-release@v3
        with:
          files: dist-electron/aidigest-panel.exe

